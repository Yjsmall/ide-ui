<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZCode IDE</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <!-- Main macOS App Window Frame -->
  <div class="mac-window" id="appWindow">
    
    <!-- Top-Left Fixed Navigation Controls Bar (Sidebar toggle + Back/Forward) -->
    <div class="fixed-top-nav" id="fixedTopNav">

      <!-- Navigation & Sidebar Toggle Group -->
      <div class="nav-btn-group">
        <!-- Sidebar Toggle Icon Button -->
        <button class="nav-icon-btn active" id="btnToggleSidebar" title="切换侧边栏 (点击展开/折叠)">
          <svg width="16" height="16" viewBox="0 0 18 18" fill="none">
            <rect x="2" y="2.5" width="14" height="13" rx="2.5" stroke="currentColor" stroke-width="1.4"/>
            <path d="M6.5 2.5v13" stroke="currentColor" stroke-width="1.4"/>
          </svg>
        </button>

        <!-- Back Button -->
        <button class="nav-icon-btn disabled" id="btnNavBack" title="后退">
          <svg width="15" height="15" viewBox="0 0 18 18" fill="none">
            <path d="M11 4.5L6.5 9L11 13.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

        <!-- Forward Button -->
        <button class="nav-icon-btn disabled" id="btnNavForward" title="前进">
          <svg width="15" height="15" viewBox="0 0 18 18" fill="none">
            <path d="M7 4.5L11.5 9L7 13.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

        <!-- New Task Button (Appears when sidebar is collapsed, matching Image 1) -->
        <button class="nav-icon-btn new-task-icon-btn" id="btnNavNewTask" title="新建任务">
          <svg width="16" height="16" viewBox="0 0 18 18" fill="none">
            <rect x="2" y="2" width="14" height="14" rx="3.5" stroke="currentColor" stroke-width="1.3"/>
            <path d="M9 5.5v7M5.5 9h7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- IDE Body Layout -->
    <div class="ide-container sidebar-expanded" id="ideContainer">
      
      <!-- Embedded Sidebar (Embedded into window background) -->
      <aside class="embedded-sidebar" id="embeddedSidebar">
        <!-- Spacer reserved for top-left fixed controls -->
        <div class="sidebar-header-spacer"></div>

        <!-- Sidebar Actions Section -->
        <div class="sidebar-top-actions">
          <button class="action-row" id="btnSidebarNewTask">
            <div class="action-left">
              <svg width="15" height="15" viewBox="0 0 18 18" fill="none" class="action-icon">
                <circle cx="9" cy="9" r="6.5" stroke="currentColor" stroke-width="1.4"/>
                <path d="M9 6v6M6 9h6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
              </svg>
              <span>New task</span>
            </div>
            <kbd class="shortcut-key">⌘ N</kbd>
          </button>

          <button class="action-row" id="btnSidebarSearch">
            <div class="action-left">
              <svg width="15" height="15" viewBox="0 0 18 18" fill="none" class="action-icon">
                <circle cx="8" cy="8" r="5" stroke="currentColor" stroke-width="1.4"/>
                <path d="M12 12l3.5 3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
              </svg>
              <span>Search</span>
            </div>
            <kbd class="shortcut-key">⌘ K</kbd>
          </button>

          <button class="action-row">
            <div class="action-left">
              <svg width="15" height="15" viewBox="0 0 18 18" fill="none" class="action-icon">
                <rect x="3" y="3.5" width="12" height="11" rx="2" stroke="currentColor" stroke-width="1.4"/>
                <path d="M3 7.5h12M6 2v3M12 2v3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
              </svg>
              <span>Automations</span>
            </div>
          </button>

          <button class="action-row">
            <div class="action-left">
              <svg width="15" height="15" viewBox="0 0 18 18" fill="none" class="action-icon">
                <path d="M7 3a2 2 0 0 0 4 0h3v4a2 2 0 0 0 0 4v4H3v-4a2 2 0 0 0 0-4V3h4z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
              </svg>
              <span>Plugin Marketplace</span>
            </div>
          </button>
        </div>

        <!-- Hidden Directory Input for uploading folders -->
        <input type="file" id="folderInput" webkitdirectory directory multiple style="display: none;">

        <!-- Projects Header -->
        <div class="projects-section-header">
          <span class="section-title">Projects</span>
          <div style="display: flex; align-items: center; gap: 4px;">
            <button class="add-project-quick" id="btnUploadFolder" title="上传本地文件夹">
              <svg width="13" height="13" viewBox="0 0 16 16" fill="none">
                <path d="M1.5 3.5A1.5 1.5 0 0 1 3 2h3.5l1.5 1.5H13A1.5 1.5 0 0 1 14.5 5v7A1.5 1.5 0 0 1 13 13.5H3A1.5 1.5 0 0 1 1.5 12V3.5z" stroke="currentColor" stroke-width="1.2"/>
                <path d="M8 6.5v4.5M6 8.5l2-2 2 2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <button class="add-project-quick" id="btnQuickAddProject" title="新建项目文件夹">+</button>
          </div>
        </div>

        <!-- Projects List Container (Scrollable) -->
        <div class="projects-list" id="projectsList">
          <!-- Populated dynamically via app.js -->
        </div>

        <!-- Sidebar Bottom Profile & Controls -->
        <div class="sidebar-bottom-bar">
          <div class="user-profile">
            <div class="user-avatar" title="JY User Profile">
              <span>JY</span>
            </div>
            <span class="user-name">J Y</span>
          </div>
          <div class="bottom-tools">
            <button class="tool-btn battery-btn" title="设备与连接状态: 良好">
              <svg width="15" height="15" viewBox="0 0 18 18" fill="none">
                <rect x="4" y="3" width="9" height="13" rx="2" stroke="#e5a93b" stroke-width="1.3"/>
                <path d="M7 1.8h3" stroke="#e5a93b" stroke-width="1.3" stroke-linecap="round"/>
                <path d="M6 12h5" stroke="#e5a93b" stroke-width="1.2"/>
              </svg>
            </button>
            <button class="tool-btn settings-btn" id="btnSettings" title="设置">
              <svg width="15" height="15" viewBox="0 0 18 18" fill="none">
                <circle cx="9" cy="9" r="2.5" stroke="currentColor" stroke-width="1.3"/>
                <path d="M9 2v2M9 14v2M2 9h2M14 9h2M4 4l1.5 1.5M12.5 12.5L14 14M4 14l1.5-1.5M12.5 5.5L14 4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
        </div>
      </aside>

      <!-- Floating Window (The Right Elevated Floating Card) -->
      <main class="floating-window" id="floatingWindow">
      </main>

    </div>

    <!-- Notification Toast -->
    <div class="toast-notification" id="toast">已更新</div>

  </div>

  <script src="./app.js"></script>
</body>
</html>
